<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>六省区销售管理工具</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2330;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff}
html,body{width:100%;height:100%;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
input,select,button{font-family:inherit}
.app{display:flex;height:100vh}
.sidebar{width:210px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.content{flex:1;overflow:auto;padding:20px}
.sidebar-logo{padding:18px 16px;border-bottom:1px solid var(--border);font-size:15px;font-weight:800;color:var(--accent)}
.sidebar-logo span{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.03);transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:rgba(88,166,255,.12);color:var(--accent);border-left:3px solid var(--accent)}
.dim-toggle{display:flex;background:var(--surface2);border-radius:20px;padding:3px;margin-left:auto;gap:2px}
.dim-btn{padding:5px 14px;border-radius:17px;border:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);background:transparent;transition:all .2s}
.dim-btn.active{background:var(--accent);color:#fff}
.hdr-actions{display:flex;gap:8px;margin-left:12px}
.btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#4090e0;color:#fff;border-color:#4090e0}
.btn-sm{padding:3px 9px;font-size:12px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat-card .val{font-size:26px;font-weight:800;line-height:1}
.stat-card .sub{font-size:12px;color:var(--muted);margin-top:4px}
.sec-title{font-size:17px;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:rgba(88,166,255,.1);color:var(--accent);padding:9px 11px;text-align:left;font-weight:600;border-bottom:1px solid var(--accent);position:sticky;top:0;white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
tr.good td{background:rgba(63,185,80,.04)}
tr.warn td{background:rgba(248,81,73,.04)}
.num{text-align:right}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}
.badge-blue{background:rgba(88,166,255,.15);color:var(--accent)}
.gs{color:#ffd700;font-weight:800}.ga{color:var(--green);font-weight:700}.gb{color:var(--accent);font-weight:700}.gc{color:var(--yellow);font-weight:700}.gd{color:var(--red);font-weight:700}
.pw{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.pt{width:60px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;flex-shrink:0}
.pf{height:100%;border-radius:3px}
.pv{font-size:12px;min-width:36px;text-align:right}
/* 排名 */
.rc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.rn{font-size:22px;font-weight:900;width:36px;text-align:center;flex-shrink:0}
.ri{flex:1}
.rname{font-size:15px;font-weight:700}
.rsub{font-size:12px;color:var(--muted);margin-top:2px}
.rbar{height:8px;background:var(--surface2);border-radius:4px;margin-top:6px;overflow:hidden}
.rfill{height:100%;border-radius:4px}
.rscore{font-size:22px;font-weight:900;color:var(--accent)}
/* 分析 */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px}
.acard h3{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:14px}
.brow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bname{font-size:13px;width:64px;flex-shrink:0;text-align:right;color:var(--muted)}
.bbg{flex:1;height:18px;background:var(--surface2);border-radius:9px;overflow:hidden}
.bfg{height:100%;border-radius:9px;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:700;color:#fff;min-width:2px;white-space:nowrap}
.bpct{font-size:12px;width:42px;text-align:right;font-weight:700;flex-shrink:0}
/* 省份 */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.rcard h3{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:12px}
.rstat{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.rstat:last-child{border:none}
/* AI分析 */
.ai-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ai-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px}
.ai-card .ai-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ai-card .ai-name{font-size:15px;font-weight:700}
.ai-card .ai-score{font-size:13px;color:var(--muted)}
.ai-card .ai-body{font-size:13px;line-height:1.8;color:var(--text)}
.ai-card .ai-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;margin-right:4px;margin-bottom:6px}
.tag-green{background:rgba(63,185,80,.15);color:var(--green)}
.tag-red{background:rgba(248,81,73,.15);color:var(--red)}
.tag-yellow{background:rgba(210,153,34,.15);color:var(--yellow)}
.tag-blue{background:rgba(88,166,255,.15);color:var(--accent)}
/* 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;width:680px;max-width:95vw;max-height:88vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:800;margin-bottom:20px;color:var(--accent)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fi{display:flex;flex-direction:column;gap:5px}
.fi label{font-size:12px;color:var(--muted);font-weight:600}
.fi input,.fi select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:14px;outline:none}
.fi input:focus,.fi select:focus{border-color:var(--accent)}
.fsec{margin-top:18px;padding:14px;background:rgba(88,166,255,.05);border:1px solid rgba(88,166,255,.15);border-radius:10px}
.fsec h4{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px}
.irow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.irow .fi{margin:0}
.ilabel{font-size:12px;font-weight:700;color:var(--text);padding:8px 0 4px;border-bottom:1px solid var(--border);margin-bottom:8px}
.prev{margin-top:14px;padding:12px;background:var(--surface2);border-radius:8px;font-size:13px;line-height:1.8}
.macts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
/* 配置 */
.cc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
.cc h3{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:14px}
.ts{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
.ts input{opacity:0;width:0;height:0}
.tsl{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:10px;transition:.3s}
.tsl:before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.tsl{background:var(--accent)}
input:checked+.tsl:before{transform:translateX(16px)}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-logo">六省区销售管理<span>2026年6月 · 13人</span></div>
    <div class="nav-item active" onclick="go('dashboard')" id="nav-dashboard">📊 数据看板</div>
    <div class="nav-item" onclick="go('analysis')" id="nav-analysis">📈 分析看板</div>
    <div class="nav-item" onclick="go('ranking')" id="nav-ranking">🏆 个人排名</div>
    <div class="nav-item" onclick="go('region')" id="nav-region">🗺️ 省份排名</div>
    <div class="nav-item" onclick="go('ai')" id="nav-ai">🤖 AI 分析</div>
    <div class="nav-item" onclick="go('config')" id="nav-config">⚙️ 配置</div>
  </div>
  <div class="main">
    <div class="header">
      <div id="hTitle" style="font-size:18px;font-weight:700">📊 数据看板</div>
      <div class="dim-toggle" id="dimToggle">
        <button class="dim-btn active" onclick="setDim('month')" id="dimM">月维度</button>
        <button class="dim-btn" onclick="setDim('week')" id="dimW">周维度</button>
      </div>
      <div class="hdr-actions">
        <button class="btn" onclick="document.getElementById('importFile').click()">📥 导入CSV</button>
        <input type="file" id="importFile" accept=".csv" style="display:none" onchange="importCSV(event)">
        <button class="btn" onclick="exportCSV()">📤 导出CSV</button>
        <button class="btn btn-primary" onclick="openAdd()">✏️ 录入</button>
      </div>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>

<div class="overlay" id="recModal" onclick="if(event.target===this)closeModal()">
<div class="modal">
  <h2 id="mTitle">✏️ 录入数据</h2>
  <div class="fgrid">
    <div class="fi"><label>姓名</label><select id="fName" onchange="onPC()"><option value="">请选择</option></select></div>
    <div class="fi"><label>月份</label><input id="fMonth" type="month" value="2026-06"></div>
  </div>
  <div class="fsec">
    <h4>🚚 发车数据</h4>
    <div class="fgrid">
      <div class="fi"><label>月发车实际</label><input id="fSAm" type="number" min="0" placeholder="0" oninput="prev()"></div>
      <div class="fi"><label>月发车目标</label><input id="fSTm" type="number" min="0" placeholder="0" oninput="prev()"></div>
      <div class="fi"><label>周发车实际</label><input id="fSAw" type="number" min="0" placeholder="0" oninput="prev()"></div>
      <div class="fi"><label>周发车目标</label><input id="fSTw" type="number" min="0" placeholder="0" oninput="prev()"></div>
    </div>
  </div>
  <div class="fsec" id="indSec"></div>
  <div class="prev" id="prevBox">填写后自动预览</div>
  <div class="macts">
    <button class="btn" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="saveRec()">保存</button>
  </div>
</div>
</div>

  records:JSON.parse(localStorage.getItem('sr')||JSON.stringify(DEF_REC)),
  people:JSON.parse(localStorage.getItem('sp')||JSON.stringify(DEF_PPL)),

};}

function cs(rec,inds,d){
  const s=d==='month'?'_m':'_w';
  const sa=rec['salesAct'+s]||0,st=rec['salesTarget'+s]||1;
  const rs=Math.min(120,st>0?(sa/st)*100:0);
  const ai=inds.filter(i=>i.enabled!==false);
  let pt=0,pc=0;
  ai.forEach(ind=>{const a=rec['act'+s+'_'+ind.id]||0,t=rec['tgt'+s+'_'+ind.id]||0;if(t>0){pt+=Math.min(120,(a/t)*100);pc++;}});
  const ps=pc>0?pt/pc:0;
  const w=JSON.parse(localStorage.getItem('sw')||JSON.stringify(DEF_WTS));
  const comp=ps*(w.pw/100)+rs*(w.rw/100);
  let g='D',gc='gd';
  if(comp>=90){g='S';gc='gs';}else if(comp>=75){g='A';gc='ga';}else if(comp>=60){g='B';gc='gb';}else if(comp>=45){g='C';gc='gc';}
  return{rs,ps,comp,g,gc};
}

function lr(d){const m={};d.records.forEach(r=>{const k=r.name+'_'+r.region;if(!m[k]||r.month>=m[k].month)m[k]=r;});return m;}

      const rec=lrecs[p.name+'_'+p.region]||{},{rs,ps,comp,g,gc}=cs(rec,d.indicators,dim);

// ===== AI分析 =====
function aiAnalyze(p, rec, inds, dim, wts){
  const s=dim==='month'?'_m':'_w', dl=dim==='month'?'月':'周';
  const sa=rec['salesAct'+s]||0, st=rec['salesTarget'+s]||1;
  const sr2=st>0?(sa/st*100):0;
  const {rs,ps,comp,g}=cs(rec,inds,dim);
  const tags=[], issues=[], goods=[], advice=[];

  // 发车分析
  if(sr2>=100){goods.push('发车目标已完成');tags.push({t:'发车达标',c:'green'});}
  else if(sr2>=70){tags.push({t:'发车接近目标',c:'yellow'});}
  else{issues.push(`发车完成率仅${sr2.toFixed(0)}%，差距较大`);tags.push({t:'发车预警',c:'red'});}

  // 过程指标分析
  inds.filter(i=>i.enabled!==false).forEach(ind=>{
    const a=rec['act'+s+'_'+ind.id]||0, t=rec['tgt'+s+'_'+ind.id]||0;
    if(t===0)return;
    const r=a/t*100;
    if(r>=100)goods.push(`${ind.name}已达标(${a}/${t})`);
    else if(r<50)issues.push(`${ind.name}完成率偏低(${a}/${t}, ${r.toFixed(0)}%)`);
  });

  // 标杆打造
  const bgA=rec['act'+s+'_biaoGan']||0, bgT=rec['tgt'+s+'_biaoGan']||0;
  if(bgT>0&&bgA>=bgT)tags.push({t:'标杆达标',c:'green'});
  else if(bgT>0&&bgA===0)issues.push('本'+dl+'尚未完成标杆打造');

  // 打卡
  const dkA=rec['act'+s+'_daKa']||0, dkT=rec['tgt'+s+'_daKa']||0;
  if(dkT>0){const r=dkA/dkT*100;if(r<60){issues.push(`打卡完成率${r.toFixed(0)}%，低于60%预警线`);tags.push({t:'打卡预警',c:'red'});}}

  // 抖音
  const dyA=rec['act'+s+'_douYin']||0, dyT=rec['tgt'+s+'_douYin']||0;
  if(dyT>0&&dyA===0){issues.push('本'+dl+'抖音发布为0，需立即跟进');tags.push({t:'抖音0发布',c:'red'});}
  else if(dyT>0&&dyA>=dyT){goods.push('抖音发布达标');}

  // 综合评价
  if(comp>=90)advice.push('综合表现优秀，保持现有节奏，可冲击更高目标。');
  else if(comp>=75)advice.push('整体表现良好，继续保持过程投入，关注发车转化。');
  else if(comp>=60){
    if(sr2<70)advice.push('发车完成率有提升空间，建议加强客户拜访和跟进转化。');
    else advice.push('过程指标需要加强，重点提升日常打卡和内容输出。');
  } else {
    advice.push('当前综合分偏低，需重点关注：①发车推进 ②日常过程动作落实 ③及时与上级沟通支持方案。');
  }

  return {tags, issues, goods, advice, comp, g, sr2, ps, rs};
}

  const d=ld(), lrecs=lr(d);
  let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><div class="sec-title" style="margin:0">🤖 AI 个人分析（${dim==='month'?'月':'周'}维度）</div></div><div class="ai-grid">`;
  d.people.forEach(p=>{

    const {tags,issues,goods,advice,comp,g,sr2,ps,rs}=aiAnalyze(p,rec,d.indicators,dim,d.wts);

  const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='销售数据_'+new Date().toISOString().slice(0,10)+'.csv';a.click();

function importCSV(e){
  const file=e.target.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      let t=ev.target.result;if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
      const lines=t.split('\n').filter(l=>l.trim()),headers=pcsv(lines[0]).map(h=>h.trim()),col={};headers.forEach((h,i)=>{col[h]=i;});
      const get=(v,n,def='')=>col[n]!==undefined&&col[n]<v.length?v[col[n]]:def;
      const gn=(v,...ns)=>{for(const n of ns){const x=get(v,n,'');if(x!=='')return+x||0;}return 0;};
      const d=ld();let cnt=0;
      for(let i=1;i<lines.length;i++){
        const v=pcsv(lines[i]);if(v.length<3)continue;
        const name=get(v,'姓名')||v[0],region=get(v,'省区')||v[1];if(!name||!region)continue;
        const mn=new Date().getFullYear()+'-'+(new Date().getMonth()+1).toString().padStart(2,'0');
        const month=get(v,'月份')||mn,isHQVal=get(v,'是否总部');
        const rec={id:Date.now()+'_'+i,name,region,month,isHQ:isHQVal==='是'||isHQVal==='1'};
        rec.salesAct_m=gn(v,'月发车实际');rec.salesTarget_m=gn(v,'月发车目标(个人)','月发车目标');
        rec.salesAct_w=gn(v,'周发车实际');rec.salesTarget_w=gn(v,'周发车目标(个人)','周发车目标');
        d.indicators.forEach(ind=>{rec['act_m_'+ind.id]=gn(v,ind.name+'_月实际');rec['tgt_m_'+ind.id]=gn(v,ind.name+'_月目标(个人)',ind.name+'_月目标');rec['act_w_'+ind.id]=gn(v,ind.name+'_周实际');rec['tgt_w_'+ind.id]=gn(v,ind.name+'_周目标(个人)',ind.name+'_周目标');});
        const ei=d.records.findIndex(r=>r.name===name&&r.region===region&&r.month===month);
        if(ei>=0)d.records[ei]=rec;else d.records.push(rec);
        if(!d.people.find(p=>p.name===name&&p.region===region))d.people.push({name,region,isHQ:rec.isHQ});
        cnt++;
      }
      sd(d);render();alert('成功导入'+cnt+'条！');
    }catch(err){alert('导入失败：'+err.message);}
  };
  rd.readAsText(file,'utf-8');e.target.value='';
}
function pcsv(line){const r=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'&&line[i+1]==='"'){c+='"';i++;}else if(ch==='"'){q=false;}else{c+=ch;}}else{if(ch==='"'){q=true;}else if(ch===','){r.push(c.trim());c='';}else{c+=ch;}}}r.push(c.trim());return r;}

render();

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>六省区销售管理工具</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2330;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--orange:#f0883e;--red:#f85149;--yellow:#d29922;--purple:#bc8cff}
html,body{width:100%;height:100%;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
input,select,textarea,button{font-family:inherit}
.app{display:flex;height:100vh}
.sidebar{width:210px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.content{flex:1;overflow:auto;padding:20px}
.sidebar-logo{padding:18px 16px;border-bottom:1px solid var(--border);font-size:15px;font-weight:800;color:var(--accent)}
.sidebar-logo span{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.03);transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:rgba(88,166,255,.12);color:var(--accent);border-left:3px solid var(--accent)}
.dim-toggle{display:flex;background:var(--surface2);border-radius:20px;padding:3px;margin-left:auto;gap:2px}
.dim-btn{padding:5px 14px;border-radius:17px;border:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);background:transparent;transition:all .2s}
.dim-btn.active{background:var(--accent);color:#fff}
.hdr-actions{display:flex;gap:8px;margin-left:12px}
.btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#4090e0;color:#fff;border-color:#4090e0}
.btn-sm{padding:3px 9px;font-size:12px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat-card .value{font-size:26px;font-weight:800;line-height:1}
.stat-card .sub{font-size:12px;color:var(--muted);margin-top:4px}
.section-title{font-size:17px;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:rgba(88,166,255,.1);color:var(--accent);padding:9px 11px;text-align:left;font-weight:600;border-bottom:1px solid var(--accent);position:sticky;top:0;white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
tr.good td{background:rgba(63,185,80,.04)}
tr.warn td{background:rgba(248,81,73,.04)}
.num{text-align:right}
.cell-badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}
.cb-blue{background:rgba(88,166,255,.15);color:var(--accent)}
.grade-s{color:#ffd700;font-weight:800}
.grade-a{color:var(--green);font-weight:700}
.grade-b{color:var(--accent);font-weight:700}
.grade-c{color:var(--yellow);font-weight:700}
.grade-d{color:var(--red);font-weight:700}
.prog-wrap{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.prog-track{width:60px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;flex-shrink:0}
.prog-fill{height:100%;border-radius:3px;transition:width .3s}
.prog-val{font-size:12px;min-width:36px;text-align:right}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;width:680px;max-width:95vw;max-height:88vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:800;margin-bottom:20px;color:var(--accent)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-item{display:flex;flex-direction:column;gap:5px}
.form-item label{font-size:12px;color:var(--muted);font-weight:600}
.form-item input,.form-item select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.form-item input:focus,.form-item select:focus{border-color:var(--accent)}
.form-section{margin-top:18px;padding:14px;background:rgba(88,166,255,.05);border:1px solid rgba(88,166,255,.15);border-radius:10px}
.form-section h4{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px}
.ind-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px;align-items:end}
.ind-row .form-item{margin:0}
.ind-label{font-size:12px;font-weight:700;color:var(--text);padding:8px 0 4px;border-bottom:1px solid var(--border);margin-bottom:8px}
.preview-box{margin-top:14px;padding:12px;background:var(--surface2);border-radius:8px;font-size:13px;line-height:1.8}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
/* 排名卡片 */
.ranking-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.rank-num{font-size:22px;font-weight:900;width:36px;text-align:center;flex-shrink:0}
.rank-info{flex:1}
.rank-name{font-size:15px;font-weight:700}
.rank-sub{font-size:12px;color:var(--muted);margin-top:2px}
.rank-bar{height:8px;background:var(--surface2);border-radius:4px;margin-top:6px;overflow:hidden}
.rank-fill{height:100%;border-radius:4px}
.rank-score{font-size:22px;font-weight:900;color:var(--accent);text-align:right}
.rank-grade{text-align:center;font-size:13px}
/* 分析看板 */
.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.analysis-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px}
.analysis-card h3{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-row .name{font-size:13px;width:60px;flex-shrink:0;text-align:right;color:var(--muted)}
.bar-row .bar-bg{flex:1;height:18px;background:var(--surface2);border-radius:9px;overflow:hidden;position:relative}
.bar-row .bar-fg{height:100%;border-radius:9px;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:700;color:#fff;min-width:2px}
.bar-row .pct{font-size:12px;width:42px;text-align:right;font-weight:700;flex-shrink:0}
/* 省份排名 */
.region-rank{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.region-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.region-card h3{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.region-stat{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.region-stat:last-child{border:none}
/* 配置 */
.config-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
.config-card h3{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:14px}
.toggle-switch{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:10px;transition:.3s}
.toggle-slider:before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.toggle-slider{background:var(--accent)}
input:checked+.toggle-slider:before{transform:translateX(16px)}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-logo">六省区销售管理<span>2026年6月 · 13人</span></div>
    <div class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">📊 数据看板</div>
    <div class="nav-item" onclick="showPage('analysis')" id="nav-analysis">📈 分析看板</div>
    <div class="nav-item" onclick="showPage('ranking')" id="nav-ranking">🏆 个人排名</div>
    <div class="nav-item" onclick="showPage('region')" id="nav-region">🗺️ 省份排名</div>
    <div class="nav-item" onclick="showPage('config')" id="nav-config">⚙️ 配置管理</div>
  </div>
  <div class="main">
    <div class="header">
      <div id="headerTitle" style="font-size:18px;font-weight:700">📊 数据看板</div>
      <div class="dim-toggle" id="dimToggle">
        <button class="dim-btn active" onclick="setDim('month')" id="dimMonth">月维度</button>
        <button class="dim-btn" onclick="setDim('week')" id="dimWeek">周维度</button>
      </div>
      <div class="hdr-actions">
        <button class="btn" onclick="document.getElementById('importFile').click()">📥 导入CSV</button>
        <input type="file" id="importFile" accept=".csv" style="display:none" onchange="importCSV(event)">
        <button class="btn" onclick="exportCSV()">📤 导出CSV</button>
        <button class="btn btn-primary" onclick="openAddRecord()">✏️ 录入数据</button>
      </div>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>

<div class="modal-overlay" id="recordModal" onclick="if(event.target===this)closeModal()">
<div class="modal">
  <h2 id="modalTitle">✏️ 录入数据</h2>
  <div class="form-grid">
    <div class="form-item"><label>姓名</label><select id="fName" onchange="onPersonChange()"><option value="">请选择</option></select></div>
    <div class="form-item"><label>月份</label><input id="fMonth" type="month" value="2026-06"></div>
  </div>
  <div class="form-section">
    <h4>🚚 发车数据</h4>
    <div class="form-grid">
      <div class="form-item"><label>月发车实际</label><input id="fSalesAct_m" type="number" min="0" placeholder="0" oninput="preview()"></div>
      <div class="form-item"><label>月发车目标</label><input id="fSalesTgt_m" type="number" min="0" placeholder="0" oninput="preview()"></div>
      <div class="form-item"><label>周发车实际</label><input id="fSalesAct_w" type="number" min="0" placeholder="0" oninput="preview()"></div>
      <div class="form-item"><label>周发车目标</label><input id="fSalesTgt_w" type="number" min="0" placeholder="0" oninput="preview()"></div>
    </div>
  </div>
  <div class="form-section" id="indSection"></div>
  <div class="preview-box" id="previewBox">填写数据后自动预览评分</div>
  <div class="modal-actions">
    <button class="btn" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="saveRecord()">保存</button>
  </div>
</div>
</div>

const DEFAULT_WEIGHTS = {processWeight:50,resultWeight:50};

function loadData() {
  return {
    indicators: JSON.parse(localStorage.getItem('sm_indicators')||JSON.stringify(DEFAULT_INDICATORS)),
    records: JSON.parse(localStorage.getItem('sm_records')||JSON.stringify(DEFAULT_RECORDS)),
    people: JSON.parse(localStorage.getItem('sm_people')||JSON.stringify(DEFAULT_PEOPLE)),
    weights: JSON.parse(localStorage.getItem('sm_weights')||JSON.stringify(DEFAULT_WEIGHTS)),
  };
}
function saveData(d) {
  localStorage.setItem('sm_indicators',JSON.stringify(d.indicators));
  localStorage.setItem('sm_records',JSON.stringify(d.records));
  localStorage.setItem('sm_people',JSON.stringify(d.people));
  localStorage.setItem('sm_weights',JSON.stringify(d.weights));
}

function calcScore(rec, indicators, d) {
  const sfx = d==='month'?'_m':'_w';
  const sa = rec['salesAct'+sfx]||0;
  const st = rec['salesTarget'+sfx]||1;
  const resultScore = Math.min(120, st>0?(sa/st)*100:0);
  const activeInds = indicators.filter(i=>i.enabled!==false);
  let procTotal=0,procCount=0;
  activeInds.forEach(ind=>{
    const act=rec['act'+sfx+'_'+ind.id]||0;
    const tgt=rec['tgt'+sfx+'_'+ind.id]||0;
    if(tgt>0){procTotal+=Math.min(120,(act/tgt)*100);procCount++;}
  });
  const processScore=procCount>0?procTotal/procCount:0;
  const wts=JSON.parse(localStorage.getItem('sm_weights')||JSON.stringify(DEFAULT_WEIGHTS));
  const pw=(wts.processWeight||50)/100, rw=(wts.resultWeight||50)/100;
  const composite=processScore*pw+resultScore*rw;
  let grade='D',gradeClass='grade-d';
  if(composite>=90){grade='S';gradeClass='grade-s';}
  else if(composite>=75){grade='A';gradeClass='grade-a';}
  else if(composite>=60){grade='B';gradeClass='grade-b';}
  else if(composite>=45){grade='C';gradeClass='grade-c';}
  return {resultScore,processScore,composite,grade,gradeClass};
}

function getLatestRecs(d) {
  const lr={};
  d.records.forEach(r=>{const k=r.name+'_'+r.region;if(!lr[k]||r.month>=lr[k].month)lr[k]=r;});
  return lr;
}

  document.getElementById('headerTitle').textContent=titles[page];
  document.getElementById('dimToggle').style.display=page==='config'?'none':'flex';
  render();
}

  const c=document.getElementById('pageContent');
  if(curPage==='dashboard')renderDashboard(c);
  else if(curPage==='analysis')renderAnalysis(c);
  else if(curPage==='ranking')renderRanking(c);

  else renderConfig(c);
}

// ===== 数据看板 =====
function renderDashboard(c) {
  const d=loadData(), sfx=dim==='month'?'_m':'_w', dimLabel=dim==='month'?'月':'周';
  const lr=getLatestRecs(d);
  const scores=d.people.map(p=>calcScore(lr[p.name+'_'+p.region]||{},d.indicators,dim).composite);
  const avgScore=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):0;
  const reachCount=scores.filter(s=>s>=60).length;
  const warnCount=scores.filter(s=>s<60).length;
  const totalAct=d.people.reduce((s,p)=>s+(lr[p.name+'_'+p.region]||{})['salesAct'+sfx]||0,0);
  const totalTgt=d.people.reduce((s,p)=>s+(lr[p.name+'_'+p.region]||{})['salesTarget'+sfx]||0,0);
  const totalRate=totalTgt>0?((totalAct/totalTgt)*100).toFixed(1):0;

  let html=`<div class="stat-row">
    <div class="stat-card"><div class="label">${dimLabel}发车合计</div><div class="value" style="color:var(--green)">${totalAct}</div><div class="sub">目标 ${totalTgt} · 完成率 ${totalRate}%</div></div>
    <div class="stat-card"><div class="label">平均综合分</div><div class="value" style="color:var(--accent)">${avgScore}</div><div class="sub">${dimLabel}维度</div></div>
    <div class="stat-card"><div class="label">达标人数（≥60分）</div><div class="value" style="color:var(--green)">${reachCount}</div><div class="sub">共${d.people.length}人</div></div>
    <div class="stat-card"><div class="label">预警人数（<60分）</div><div class="value" style="color:var(--red)">${warnCount}</div><div class="sub">需重点关注</div></div>
  </div>`;

  const regions=[...new Set(d.people.map(p=>p.region))];
  regions.forEach(region=>{
    const rPeople=d.people.filter(p=>p.region===region);
    html+=`<div style="margin-bottom:28px"><div class="section-title">📍 ${region}省区</div><div class="table-wrap"><table><thead><tr>
      <th>姓名</th><th>身份</th><th class="num">发车实际</th><th class="num">发车目标</th><th class="num">完成率</th>`;
    d.indicators.filter(i=>i.enabled!==false).forEach(ind=>{html+=`<th class="num">${ind.name}</th>`;});
    html+=`<th class="num">过程分</th><th class="num">结果分</th><th class="num">综合分</th><th>等级</th><th></th></tr></thead><tbody>`;
    rPeople.forEach(p=>{
      const rec=lr[p.name+'_'+p.region]||{};
      const {resultScore,processScore,composite,grade,gradeClass}=calcScore(rec,d.indicators,dim);
      const sa=rec['salesAct'+sfx]||0,st=rec['salesTarget'+sfx]||0;
      const rate=st>0?Math.min(120,(sa/st*100)).toFixed(0):0;
      const rateColor=rate>=100?'var(--green)':rate>=70?'var(--yellow)':'var(--red)';
      let trClass=composite>=75?'good':composite<45?'warn':'';
      html+=`<tr class="${trClass}"><td><strong>${p.name}</strong></td>
        <td>${p.isHQ?'<span class="cell-badge cb-blue">总部</span>':''}</td>
        <td class="num">${sa}</td><td class="num">${st}</td>
        <td class="num"><span style="color:${rateColor};font-weight:700">${rate}%</span></td>`;
      d.indicators.filter(i=>i.enabled!==false).forEach(ind=>{
        const act=rec['act'+sfx+'_'+ind.id]||0,tgt=rec['tgt'+sfx+'_'+ind.id]||0;
        const pct=tgt>0?Math.min(100,act/tgt*100):0;
        const fillColor=pct>=100?'var(--green)':pct>=70?'var(--yellow)':'var(--red)';
        html+=`<td class="num"><div class="prog-wrap"><div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${fillColor}"></div></div><span class="prog-val">${act}/${tgt}</span></div></td>`;
      });
      html+=`<td class="num">${processScore.toFixed(0)}</td><td class="num">${resultScore.toFixed(0)}</td>
        <td class="num"><strong>${composite.toFixed(0)}</strong></td>
        <td><span class="${gradeClass}">${grade}</span></td>
        <td><button class="btn btn-sm" onclick="openEditRecord('${p.name}','${p.region}')">编辑</button></td></tr>`;
    });
    html+='</tbody></table></div></div>';
  });
  c.innerHTML=html;
}

// ===== 分析看板 =====
function renderAnalysis(c) {
  const d=loadData(), sfx=dim==='month'?'_m':'_w', dimLabel=dim==='month'?'月':'周';
  const lr=getLatestRecs(d);

  // 1. 个人发车完成率排行
  const salesRanked=d.people.map(p=>{
    const rec=lr[p.name+'_'+p.region]||{};
    const sa=rec['salesAct'+sfx]||0,st=rec['salesTarget'+sfx]||0;
    const rate=st>0?(sa/st*100):0;
    return {name:p.name,region:p.region,sa,st,rate};
  }).sort((a,b)=>b.rate-a.rate);

  let salesBars='';
  salesRanked.forEach(p=>{
    const pct=Math.min(100,p.rate);
    const color=p.rate>=100?'var(--green)':p.rate>=70?'var(--yellow)':'var(--red)';
    salesBars+=`<div class="bar-row">
      <div class="name">${p.name}</div>
      <div class="bar-bg"><div class="bar-fg" style="width:${pct}%;background:${color}">${p.sa}/${p.st}</div></div>
      <div class="pct" style="color:${color}">${p.rate.toFixed(0)}%</div>
    </div>`;
  });

  // 2. 各指标团队整体完成率
  let indBars='';
  d.indicators.filter(i=>i.enabled!==false).forEach(ind=>{
    let totalAct=0,totalTgt=0;
    d.people.forEach(p=>{
      const rec=lr[p.name+'_'+p.region]||{};
      totalAct+=rec['act'+sfx+'_'+ind.id]||0;
      totalTgt+=rec['tgt'+sfx+'_'+ind.id]||0;
    });
    const rate=totalTgt>0?(totalAct/totalTgt*100):0;
    const pct=Math.min(100,rate);
    const color=rate>=100?'var(--green)':rate>=70?'var(--yellow)':'var(--red)';
    indBars+=`<div class="bar-row">
      <div class="name" style="width:70px">${ind.name}</div>
      <div class="bar-bg"><div class="bar-fg" style="width:${pct}%;background:${color}">${totalAct}/${totalTgt}</div></div>
      <div class="pct" style="color:${color}">${rate.toFixed(0)}%</div>
    </div>`;
  });

  // 3. 综合分分布（等级统计）
  const gradeCount={S:0,A:0,B:0,C:0,D:0};
  d.people.forEach(p=>{
    const {grade}=calcScore(lr[p.name+'_'+p.region]||{},d.indicators,dim);
    gradeCount[grade]=(gradeCount[grade]||0)+1;
  });
  const gradeColors={S:'#ffd700',A:'var(--green)',B:'var(--accent)',C:'var(--yellow)',D:'var(--red)'};
  let gradeBars='';
  Object.entries(gradeCount).forEach(([g,cnt])=>{
    const pct=(cnt/d.people.length*100);
    gradeBars+=`<div class="bar-row">
      <div class="name" style="width:20px;color:${gradeColors[g]};font-weight:800">${g}</div>
      <div class="bar-bg"><div class="bar-fg" style="width:${pct}%;background:${gradeColors[g]}">${cnt}人</div></div>
      <div class="pct" style="color:${gradeColors[g]}">${pct.toFixed(0)}%</div>
    </div>`;
  });

  // 4. 预警列表
  const warnPeople=d.people.filter(p=>calcScore(lr[p.name+'_'+p.region]||{},d.indicators,dim).composite<60);
  let warnHtml='';
  if(warnPeople.length===0){
    warnHtml='<div style="color:var(--green);font-size:13px;padding:8px 0">🎉 全员达标，无预警</div>';
  } else {
    warnPeople.forEach(p=>{
      const rec=lr[p.name+'_'+p.region]||{};
      const {composite,grade,gradeClass}=calcScore(rec,d.indicators,dim);
      const sa=rec['salesAct'+sfx]||0,st=rec['salesTarget'+sfx]||0;
      const rate=st>0?(sa/st*100).toFixed(0):0;
      warnHtml+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
        <div><strong>${p.name}</strong><span style="font-size:12px;color:var(--muted);margin-left:8px">${p.region}</span></div>
        <div style="font-size:13px">发车${rate}% · 综合<span class="${gradeClass}" style="margin-left:4px">${composite.toFixed(0)}分(${grade})</span></div>
      </div>`;
    });
  }

  c.innerHTML=`
  <div class="analysis-grid">
    <div class="analysis-card"><h3>🚚 ${dimLabel}发车完成率排行（个人）</h3>${salesBars}</div>
    <div class="analysis-card"><h3>📋 过程指标团队完成率（${dimLabel}）</h3>${indBars}</div>
    <div class="analysis-card"><h3>📊 等级分布</h3>${gradeBars}</div>
    <div class="analysis-card"><h3>🔴 预警人员（综合分 < 60）</h3>${warnHtml}</div>
  </div>`;
}

      <div class="rank-info">
        <div class="rank-name">${p.name} ${p.isHQ?'<span class="cell-badge cb-blue">总部</span>':''} <span style="font-size:12px;color:var(--muted)">${p.region}</span></div>
        <div class="rank-sub">发车 ${sa}/${st}（${rate}%）· 过程 ${p.processScore.toFixed(0)}分 · 结果 ${p.resultScore.toFixed(0)}分</div>
        <div class="rank-bar"><div class="rank-fill" style="width:${barWidth}%;background:${barColor}"></div></div>
      </div>
      <div><div class="rank-score">${p.composite.toFixed(0)}</div><div class="rank-grade"><span class="${p.gradeClass}">${p.grade}</span></div></div>
    </div>`;
  });
  c.innerHTML=html;
}

// ===== 省份排名 =====
function renderRegion(c) {
  const d=loadData(), sfx=dim==='month'?'_m':'_w', dimLabel=dim==='month'?'月':'周';
  const lr=getLatestRecs(d);
  const regions=[...new Set(d.people.map(p=>p.region))];

  // 按省汇总
  const regionData=regions.map(region=>{
    const rPeople=d.people.filter(p=>p.region===region);
    let totalAct=0,totalTgt=0,totalScore=0;
    rPeople.forEach(p=>{
      const rec=lr[p.name+'_'+p.region]||{};
      totalAct+=rec['salesAct'+sfx]||0;
      totalTgt+=rec['salesTarget'+sfx]||0;
      totalScore+=calcScore(rec,d.indicators,dim).composite;
    });
    const rate=totalTgt>0?((totalAct/totalTgt)*100):0;
    const avgScore=rPeople.length?totalScore/rPeople.length:0;
    return {region,rPeople,totalAct,totalTgt,rate,avgScore};
  }).sort((a,b)=>b.rate-a.rate);

  const rankEmoji=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];

  // 省份排名条形图
  let barHtml='<div class="analysis-card" style="margin-bottom:20px"><h3>🗺️ 省份发车完成率排名（${dimLabel}）</h3>';
  regionData.forEach((rd,i)=>{
    const pct=Math.min(100,rd.rate);
    const color=rd.rate>=100?'var(--green)':rd.rate>=70?'var(--yellow)':'var(--red)';
    barHtml+=`<div class="bar-row">
      <div class="name" style="width:50px">${rankEmoji[i]} ${rd.region}</div>
      <div class="bar-bg"><div class="bar-fg" style="width:${pct}%;background:${color}">${rd.totalAct}/${rd.totalTgt}</div></div>
      <div class="pct" style="color:${color}">${rd.rate.toFixed(0)}%</div>
    </div>`;
  });
  barHtml=barHtml.replace('${dimLabel}',dimLabel)+'</div>';

  // 各省详情卡
  let cardsHtml='<div class="region-rank">';
  regionData.forEach((rd,i)=>{
    cardsHtml+=`<div class="region-card">
      <h3>${rankEmoji[i]||'#'+(i+1)} ${rd.region} <span style="font-size:12px;color:var(--muted);font-weight:400">${rd.rPeople.length}人</span></h3>
      <div class="region-stat"><span>发车实际</span><span style="font-weight:700">${rd.totalAct} 台</span></div>
      <div class="region-stat"><span>发车目标</span><span>${rd.totalTgt} 台</span></div>
      <div class="region-stat"><span>完成率</span><span style="font-weight:700;color:${rd.rate>=100?'var(--green)':rd.rate>=70?'var(--yellow)':'var(--red)'}">${rd.rate.toFixed(1)}%</span></div>
      <div class="region-stat"><span>平均综合分</span><span style="font-weight:700;color:var(--accent)">${rd.avgScore.toFixed(0)} 分</span></div>`;
    // 省内人员简列
    rd.rPeople.forEach(p=>{
      const rec=lr[p.name+'_'+p.region]||{};
      const sa=rec['salesAct'+sfx]||0,st=rec['salesTarget'+sfx]||0;
      const rate=st>0?(sa/st*100).toFixed(0):0;
      const {composite}=calcScore(rec,d.indicators,dim);
      cardsHtml+=`<div class="region-stat" style="font-size:12px">
        <span>${p.isHQ?'⭐':''} ${p.name}</span>
        <span style="color:var(--muted)">${sa}/${st} (${rate}%) · ${composite.toFixed(0)}分</span>
      </div>`;
    });
    cardsHtml+='</div>';
  });
  cardsHtml+='</div>';

  c.innerHTML=`<div class="section-title">🗺️ ${dimLabel}维度省份排名</div>${barHtml}${cardsHtml}`;
}

// ===== 配置 =====
function renderConfig(c) {
  const d=loadData(), wts=d.weights||DEFAULT_WEIGHTS;
  let indRows='';
  d.indicators.forEach((ind,idx)=>{
    indRows+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)">
      <label class="toggle-switch"><input type="checkbox" ${ind.enabled!==false?'checked':''} onchange="toggleInd(${idx},this.checked)"><span class="toggle-slider"></span></label>
      <span style="flex:1;font-size:14px">${ind.name}</span>
      <span style="font-size:12px;color:var(--muted)">${ind.unit}/次</span>
    </div>`;
  });
  c.innerHTML=`
    <div class="config-card"><h3>⚖️ 评分权重</h3>
      <div style="display:flex;gap:20px;align-items:center">
        <div class="form-item" style="flex:1"><label>过程指标权重 (%)</label><input type="number" min="0" max="100" value="${wts.processWeight||50}" onchange="updateWeights('processWeight',+this.value)"></div>
        <div class="form-item" style="flex:1"><label>结果指标权重 (%)</label><input type="number" min="0" max="100" value="${wts.resultWeight||50}" onchange="updateWeights('resultWeight',+this.value)"></div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px">综合分 = 过程均分×${wts.processWeight||50}% + 发车完成率×${wts.resultWeight||50}%</div>
    </div>
    <div class="config-card"><h3>📋 过程指标</h3>${indRows}</div>
    <div class="config-card"><h3>🗑️ 数据管理</h3>
      <div style="display:flex;gap:10px">
        <button class="btn" style="color:var(--red);border-color:var(--red)" onclick="if(confirm('确认清空录入数据？')){const d=loadData();d.records=[];saveData(d);render()}">清空录入数据</button>
        <button class="btn" style="color:var(--red);border-color:var(--red)" onclick="if(confirm('确认恢复出厂？')){localStorage.clear();location.reload()}">恢复出厂设置</button>
      </div>
    </div>`;
}
function toggleInd(idx,val){const d=loadData();d.indicators[idx].enabled=val;saveData(d);renderConfig(document.getElementById('pageContent'));}
function updateWeights(key,val){const d=loadData();d.weights=d.weights||DEFAULT_WEIGHTS;d.weights[key]=val;if(key==='processWeight')d.weights.resultWeight=100-val;else d.weights.processWeight=100-val;saveData(d);renderConfig(document.getElementById('pageContent'));}

// ===== 录入弹窗 =====
function openAddRecord(){
  document.getElementById('modalTitle').textContent='✏️ 录入数据';
  const d=loadData();
  const sel=document.getElementById('fName');
  sel.innerHTML='<option value="">请选择</option>'+d.people.map(p=>`<option value="${p.name}|${p.region}">${p.name}（${p.region}）</option>`).join('');
  document.getElementById('fMonth').value='2026-06';
  clearForm(); buildIndSection();
  document.getElementById('recordModal').classList.add('show');
}
function openEditRecord(name,region){
  document.getElementById('modalTitle').textContent='✏️ 编辑 - '+name;
  const d=loadData();
  const sel=document.getElementById('fName');
  sel.innerHTML='<option value="">请选择</option>'+d.people.map(p=>`<option value="${p.name}|${p.region}">${p.name}（${p.region}）</option>`).join('');
  sel.value=name+'|'+region;
  const lr=getLatestRecs(d), rec=lr[name+'_'+region]||{};
  document.getElementById('fMonth').value=rec.month||'2026-06';
  document.getElementById('fSalesAct_m').value=rec.salesAct_m||'';
  document.getElementById('fSalesTgt_m').value=rec.salesTarget_m||'';
  document.getElementById('fSalesAct_w').value=rec.salesAct_w||'';
  document.getElementById('fSalesTgt_w').value=rec.salesTarget_w||'';
  buildIndSection(rec);
  document.getElementById('recordModal').classList.add('show');
  preview();
}
function onPersonChange(){
  const d=loadData(), val=document.getElementById('fName').value;
  if(!val){clearForm();buildIndSection();return;}
  const [name,region]=val.split('|');
  const lr=getLatestRecs(d), rec=lr[name+'_'+region]||{};
  document.getElementById('fMonth').value=rec.month||'2026-06';
  document.getElementById('fSalesAct_m').value=rec.salesAct_m||'';
  document.getElementById('fSalesTgt_m').value=rec.salesTarget_m||'';
  document.getElementById('fSalesAct_w').value=rec.salesAct_w||'';
  document.getElementById('fSalesTgt_w').value=rec.salesTarget_w||'';
  buildIndSection(rec); preview();
}
function clearForm(){['fSalesAct_m','fSalesTgt_m','fSalesAct_w','fSalesTgt_w'].forEach(id=>document.getElementById(id).value='');}
function buildIndSection(rec){
  rec=rec||{};
  const d=loadData();
  let html='<h4>📋 过程指标</h4>';
  d.indicators.forEach(ind=>{
    if(ind.enabled===false)return;
    html+=`<div class="ind-label">${ind.name}（${ind.unit}）</div>
    <div class="ind-row">
      <div class="form-item"><label>月实际</label><input id="fi_act_m_${ind.id}" type="number" min="0" value="${rec['act_m_'+ind.id]||''}" placeholder="0" oninput="preview()"></div>
      <div class="form-item"><label>月目标</label><input id="fi_tgt_m_${ind.id}" type="number" min="0" value="${rec['tgt_m_'+ind.id]||''}" placeholder="0" oninput="preview()"></div>
      <div class="form-item" style="visibility:hidden"></div>
      <div class="form-item"><label>周实际</label><input id="fi_act_w_${ind.id}" type="number" min="0" value="${rec['act_w_'+ind.id]||''}" placeholder="0" oninput="preview()"></div>
      <div class="form-item"><label>周目标</label><input id="fi_tgt_w_${ind.id}" type="number" min="0" value="${rec['tgt_w_'+ind.id]||''}" placeholder="0" oninput="preview()"></div>
      <div class="form-item" style="visibility:hidden"></div>
    </div>`;
  });
  document.getElementById('indSection').innerHTML=html;
}
function preview(){
  const d=loadData(), rec=buildTempRec(d);
  const ms=calcScore(rec,d.indicators,'month'), ws=calcScore(rec,d.indicators,'week');
  document.getElementById('previewBox').innerHTML=
    `<strong>月维度：</strong> 过程${ms.processScore.toFixed(0)} · 结果${ms.resultScore.toFixed(0)} · <strong>综合${ms.composite.toFixed(0)}</strong> <span class="${ms.gradeClass}">${ms.grade}</span>&nbsp;&nbsp;
     <strong>周维度：</strong> 过程${ws.processScore.toFixed(0)} · 结果${ws.resultScore.toFixed(0)} · <strong>综合${ws.composite.toFixed(0)}</strong> <span class="${ws.gradeClass}">${ws.grade}</span>`;
}
function buildTempRec(d){
  const rec={
    salesAct_m:+(document.getElementById('fSalesAct_m').value||0),
    salesTarget_m:+(document.getElementById('fSalesTgt_m').value||1),
    salesAct_w:+(document.getElementById('fSalesAct_w').value||0),
    salesTarget_w:+(document.getElementById('fSalesTgt_w').value||1),
  };
  d.indicators.forEach(ind=>{
    if(ind.enabled===false)return;
    rec['act_m_'+ind.id]=+(document.getElementById('fi_act_m_'+ind.id)?.value||0);
    rec['tgt_m_'+ind.id]=+(document.getElementById('fi_tgt_m_'+ind.id)?.value||0);
    rec['act_w_'+ind.id]=+(document.getElementById('fi_act_w_'+ind.id)?.value||0);
    rec['tgt_w_'+ind.id]=+(document.getElementById('fi_tgt_w_'+ind.id)?.value||0);
  });
  return rec;
}
function saveRecord(){
  const d=loadData(), nameVal=document.getElementById('fName').value;
  if(!nameVal){alert('请选择姓名');return;}
  const [name,region]=nameVal.split('|');
  const month=document.getElementById('fMonth').value||'2026-06';
  const p=d.people.find(p=>p.name===name&&p.region===region);
  const rec={id:Date.now()+'',name,region,month,isHQ:p?p.isHQ:false,
    salesAct_m:+(document.getElementById('fSalesAct_m').value||0),
    salesTarget_m:+(document.getElementById('fSalesTgt_m').value||0),
    salesAct_w:+(document.getElementById('fSalesAct_w').value||0),
    salesTarget_w:+(document.getElementById('fSalesTgt_w').value||0),
  };
  d.indicators.forEach(ind=>{
    if(ind.enabled===false)return;
    rec['act_m_'+ind.id]=+(document.getElementById('fi_act_m_'+ind.id)?.value||0);
    rec['tgt_m_'+ind.id]=+(document.getElementById('fi_tgt_m_'+ind.id)?.value||0);
    rec['act_w_'+ind.id]=+(document.getElementById('fi_act_w_'+ind.id)?.value||0);
    rec['tgt_w_'+ind.id]=+(document.getElementById('fi_tgt_w_'+ind.id)?.value||0);
  });
  const existing=d.records.findIndex(r=>r.name===name&&r.region===region&&r.month===month);
  if(existing>=0)d.records[existing]=rec;else d.records.push(rec);
  saveData(d); closeModal(); render();
}
function closeModal(){document.getElementById('recordModal').classList.remove('show');}

// ===== CSV =====
function exportCSV(){
  const d=loadData(), lr=getLatestRecs(d);
  const headers=['姓名','省区','月份','是否总部','月发车实际','月发车目标','周发车实际','周发车目标'];
  d.indicators.forEach(ind=>headers.push(ind.name+'_月实际',ind.name+'_月目标',ind.name+'_周实际',ind.name+'_周目标'));
  const rows=[headers];
  d.people.forEach(p=>{
    const rec=lr[p.name+'_'+p.region]||{};
    const row=[p.name,p.region,rec.month||'2026-06',p.isHQ?'是':'否',
      rec.salesAct_m||0,rec.salesTarget_m||0,rec.salesAct_w||0,rec.salesTarget_w||0];
    d.indicators.forEach(ind=>row.push(rec['act_m_'+ind.id]||0,rec['tgt_m_'+ind.id]||0,rec['act_w_'+ind.id]||0,rec['tgt_w_'+ind.id]||0));
    rows.push(row);
  });
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('
');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='销售数据_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
function importCSV(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      let text=ev.target.result;
      if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
      const lines=text.split('
').filter(l=>l.trim());
      const headers=parseCSVLine(lines[0]).map(h=>h.trim());
      const col={};headers.forEach((h,i)=>{col[h]=i;});
      const get=(vals,name,def='')=>col[name]!==undefined&&col[name]<vals.length?vals[col[name]]:def;
      const getNum=(vals,...names)=>{for(const n of names){const v=get(vals,n,'');if(v!=='')return+v||0;}return 0;};
      const d=loadData();let count=0;
      for(let i=1;i<lines.length;i++){
        const vals=parseCSVLine(lines[i]);if(vals.length<3)continue;
        const name=get(vals,'姓名')||vals[0],region=get(vals,'省区')||vals[1];
        if(!name||!region)continue;
        const monthNow=new Date().getFullYear()+'-'+(new Date().getMonth()+1).toString().padStart(2,'0');
        const month=get(vals,'月份')||monthNow;
        const isHQVal=get(vals,'是否总部');
        const rec={id:Date.now()+'_'+i,name,region,month,isHQ:isHQVal==='是'||isHQVal==='1'};
        rec.salesAct_m=getNum(vals,'月发车实际');
        rec.salesTarget_m=getNum(vals,'月发车目标(个人)','月发车目标');
        rec.salesAct_w=getNum(vals,'周发车实际');
        rec.salesTarget_w=getNum(vals,'周发车目标(个人)','周发车目标');
        d.indicators.forEach(ind=>{
          rec['act_m_'+ind.id]=getNum(vals,ind.name+'_月实际');
          rec['tgt_m_'+ind.id]=getNum(vals,ind.name+'_月目标(个人)',ind.name+'_月目标');
          rec['act_w_'+ind.id]=getNum(vals,ind.name+'_周实际');
          rec['tgt_w_'+ind.id]=getNum(vals,ind.name+'_周目标(个人)',ind.name+'_周目标');
        });
        const existing=d.records.findIndex(r=>r.name===name&&r.region===region&&r.month===month);
        if(existing>=0)d.records[existing]=rec;else d.records.push(rec);
        if(!d.people.find(p=>p.name===name&&p.region===region))d.people.push({name,region,isHQ:rec.isHQ});
        count++;
      }
      saveData(d);render();alert('成功导入 '+count+' 条！');
    }catch(err){alert('导入失败：'+err.message);}
  };
  reader.readAsText(file,'utf-8');e.target.value='';
}
function parseCSVLine(line){
  const result=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(inQ){if(ch==='"'&&line[i+1]==='"'){cur+='"';i++;}else if(ch==='"'){inQ=false;}else{cur+=ch;}}
    else{if(ch==='"'){inQ=true;}else if(ch===','){result.push(cur.trim());cur='';}else{cur+=ch;}}
  }result.push(cur.trim());return result;
}

render();
</script>

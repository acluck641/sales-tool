<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>六省区销售管理工具</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2330;
  --border:#30363d;--text:#e6edf3;--muted:#8b949e;
  --accent:#58a6ff;--green:#3fb950;--orange:#f0883e;
  --red:#f85149;--yellow:#d29922;--purple:#bc8cff;
}
html,body{width:100%;height:100%;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
input,select,textarea,button{font-family:inherit}
.app{display:flex;height:100vh}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
.content{flex:1;overflow:auto;padding:24px}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border);font-size:16px;font-weight:800;color:var(--accent)}
.sidebar-logo span{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.03);transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:rgba(88,166,255,.12);color:var(--accent);border-left:3px solid var(--accent)}
.header-title{font-size:20px;font-weight:700}
.header-sub{font-size:13px;color:var(--muted)}
.mode-toggle{display:flex;background:var(--surface2);border-radius:20px;padding:3px;margin-left:auto;gap:2px}
.mode-btn{padding:6px 16px;border-radius:17px;border:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);background:transparent;transition:all .2s}
.mode-btn.active{background:var(--accent);color:#fff}
.hdr-actions{display:flex;gap:8px;margin-left:16px}
.btn{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--surface);border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#4090e0;color:#fff}
.btn-danger{background:rgba(248,81,73,.15);color:var(--red);border-color:rgba(248,81,73,.3)}
.btn-danger:hover{background:rgba(248,81,73,.25)}
.btn-sm{padding:4px 10px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.stat-card .label{font-size:13px;color:var(--muted);margin-bottom:6px}
.stat-card .value{font-size:28px;font-weight:800;line-height:1}
.stat-card .sub{font-size:13px;color:var(--muted);margin-top:4px}
.section-title{font-size:18px;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:rgba(88,166,255,.1);color:var(--accent);padding:10px 12px;text-align:left;font-weight:600;border-bottom:1px solid var(--accent);position:sticky;top:0;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.cell-score{font-size:20px;font-weight:900;min-width:50px;text-align:center}
.cell-badge{display:inline-flex;align-items:center;justify-content:center;padding:3px 12px;border-radius:12px;font-size:13px;font-weight:700;min-width:70px}
.cb-green{background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.3)}
.cb-yellow{background:rgba(210,153,34,.15);color:var(--yellow);border:1px solid rgba(210,153,34,.3)}
.cb-red{background:rgba(248,81,73,.15);color:var(--red);border:1px solid rgba(248,81,73,.3)}
.cb-blue{background:rgba(88,166,255,.15);color:var(--accent);border:1px solid rgba(88,166,255,.3)}
.prog-wrap{display:flex;align-items:center;gap:8px}
.prog-track{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;min-width:60px}
.prog-fill{height:100%;border-radius:4px;transition:width .6s}
.prog-val{font-size:13px;min-width:40px;text-align:right;font-weight:600}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:min(900px,95vw);max-height:90vh;overflow:auto}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}
.modal-header .close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;margin-left:auto;padding:4px 8px;border-radius:6px}
.modal-header .close:hover{background:rgba(255,255,255,.1);color:var(--text)}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-item{margin-bottom:12px}
.form-item label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.form-item input,.form-item select{width:100%;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.form-item input:focus,.form-item select:focus{outline:none;border-color:var(--accent)}
/* Toggle switch */
.toggle-switch{position:relative;display:inline-block;width:44px;height:24px}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,.15);border-radius:12px;transition:.3s}
.toggle-slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.toggle-slider{background:var(--accent)}
input:checked+.toggle-slider:before{transform:translateX(20px)}
/* Config */
.config-section{margin-bottom:28px}
.config-section h3{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.field-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.field-row .fname{flex:1;font-size:14px}
.field-row .fmeta{font-size:12px;color:var(--muted);flex:2}
/* Ranking */
.rank-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:10px;display:flex;align-items:center;gap:16px;transition:all .2s}
.rank-card:hover{border-color:var(--accent);background:rgba(88,166,255,.04)}
.rank-num{font-size:28px;font-weight:900;min-width:50px;text-align:center}
.rank-num.gold{color:#ffd700}
.rank-num.silver{color:#c0c0c0}
.rank-num.bronze{color:#cd7f32}
.rank-num.other{color:var(--muted)}
.rank-info{flex:1}
.rank-name{font-size:16px;font-weight:700}
.rank-region{font-size:13px;color:var(--muted);margin-top:2px}
.rank-scores{display:flex;gap:20px;align-items:center}
.rank-score-item{text-align:center}
.rank-score-item .sv{font-size:18px;font-weight:800}
.rank-score-item .sl{font-size:11px;color:var(--muted);margin-top:2px}
/* Indicator config */
.indicator-item{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.indicator-item-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.indicator-item-header .iname{flex:1;font-weight:600}
.indicator-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.indicator-grid .form-item{margin-bottom:0}
.indicator-grid .form-item label{font-size:12px}
.indicator-grid .form-item input{padding:7px 10px;font-size:13px}
/* Week data section */
.week-section{background:rgba(88,166,255,.05);border:1px solid rgba(88,166,255,.2);border-radius:10px;padding:14px;margin-top:10px}
.week-section h4{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:10px}
.week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.week-field{background:var(--surface2);border-radius:8px;padding:8px 10px}
.week-field label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
.week-field input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:14px;font-weight:600;padding:2px 0;outline:none}
.week-field input:focus{border-bottom-color:var(--accent)}
.week-field .wt{font-size:11px;color:var(--muted);margin-top:3px}
/* Tabs in modal */
.modal-tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--border);margin-top:-1px}
.modal-tab{padding:10px 16px;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;font-weight:600;transition:all .15s}
.modal-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-panel{display:none}
.tab-panel.active{display:block}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">🦞 销售管理<span>六省区大客户中心</span></div>
    <div class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">📊 数据看板</div>
    <div class="nav-item" onclick="showPage('ranking')" id="nav-ranking">🏆 销售排名</div>
    <div class="nav-item" onclick="showPage('config')" id="nav-config">⚙️ 系统配置</div>
    <div style="margin-top:auto;padding:16px;border-top:1px solid var(--border)">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">数据操作</div>
      <button class="btn btn-sm" style="width:100%;margin-bottom:6px" onclick="exportCSV()">📥 导出CSV</button>
      <button class="btn btn-sm" style="width:100%" onclick="document.getElementById('importFile').click()">📤 导入CSV</button>
      <input type="file" id="importFile" accept=".csv" style="display:none" onchange="importCSV(event)">
    </div>
  </div>
  <!-- Main -->
  <div class="main">
    <!-- Header -->
    <div class="header">
      <div>
        <div class="header-title" id="pageTitle">数据看板</div>
        <div class="header-sub" id="pageSubtitle">六省区销售过程管理</div>
      </div>
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" onclick="setMode('week')" id="modeWeek">周会模式</button>
        <button class="mode-btn" onclick="setMode('month')" id="modeMonth">月会模式</button>
      </div>
      <div class="hdr-actions">
        <button class="btn btn-primary" onclick="openAdd()">＋ 录入数据</button>
      </div>
    </div>
    <!-- Content -->
    <div class="content" id="mainContent"></div>
  </div>
</div>

<!-- Edit/Add Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <span id="modalTitle">录入数据</span>
      <button class="close" onclick="closeModal('editModal')">✕</button>
    </div>
    <div class="modal-tabs">
      <div class="modal-tab active" onclick="switchTab('tabMonth')" id="tabMonthBtn">月维度数据</div>
      <div class="modal-tab" onclick="switchTab('tabWeek')" id="tabWeekBtn">周维度数据</div>
    </div>
    <div class="modal-body">
      <div class="tab-panel active" id="tabMonth">
        <div class="form-grid" style="margin-bottom:16px">
          <div class="form-item"><label>姓名</label><input id="fName" placeholder="姓名"></div>
          <div class="form-item"><label>省区</label>
            <select id="fRegion">
              <option value="江苏">江苏</option><option value="山东">山东</option>
              <option value="河北">河北</option><option value="河南">河南</option>
              <option value="安徽">安徽</option><option value="辽宁">辽宁</option>
            </select>
          </div>
          <div class="form-item"><label>月份</label><input id="fMonth" type="month"></div>
          <div class="form-item"><label>是否总部</label>
            <select id="fIsHQ"><option value="0">否</option><option value="1">是（总部）</option></select>
          </div>
          <div class="form-item"><label>发车量（实际）</label><input id="fSalesAct" type="number" min="0" placeholder="0" oninput="previewEval()"></div>
          <div class="form-item"><label>发车量目标</label><input id="fSalesTarget" type="number" min="0" placeholder="0" oninput="previewEval()"></div>
        </div>
        <div style="font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px">📋 月过程指标</div>
        <div id="monthIndicators" class="form-grid"></div>
        <div style="margin-top:16px;padding:14px;background:var(--surface2);border-radius:10px" id="evalPreview"></div>
      </div>
      <div class="tab-panel" id="tabWeek">
        <div style="font-size:13px;color:var(--muted);margin-bottom:12px">录入本周实际数据（与月维度分开存储）</div>
        <div class="form-grid" style="margin-bottom:16px">
          <div class="form-item"><label>本周发车量（实际）</label><input id="wSalesAct" type="number" min="0" placeholder="0"></div>
          <div class="form-item"><label>本周发车量目标</label><input id="wSalesTarget" type="number" min="0" placeholder="0"></div>
        </div>
        <div style="font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px">📋 周过程指标</div>
        <div id="weekIndicators" class="form-grid"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('editModal')">取消</button>
      <button class="btn btn-primary" onclick="saveRecord()">保存</button>
    </div>
  </div>
</div>

<script>
// ─── DATA ───
const DEFAULT_PEOPLE = [
  {name:'李鸿鹤',region:'江苏',isHQ:true},{name:'曹琪',region:'江苏',isHQ:false},
  {name:'苏峰',region:'江苏',isHQ:false},{name:'杜明光',region:'江苏',isHQ:false},
  {name:'牟青',region:'山东',isHQ:true},{name:'赵成顺',region:'山东',isHQ:false},
  {name:'罗坤',region:'山东',isHQ:false},{name:'王政',region:'河北',isHQ:true},
  {name:'姚晓强',region:'河北',isHQ:false},{name:'周子坤',region:'河南',isHQ:true},
  {name:'卢恩',region:'河南',isHQ:false},{name:'熊志',region:'安徽',isHQ:false},
  {name:'许亮',region:'辽宁',isHQ:false}
];
const DEFAULT_INDICATORS = [
  {id:'biaoGan',name:'标杆打造',monthTarget:2,weekTarget:1,unit:'次',enabled:true},
  {id:'youXue',name:'游学沙龙',monthTarget:4,weekTarget:1,unit:'次',enabled:true},
  {id:'daKa',name:'打卡次数',monthTarget:30,weekTarget:8,unit:'次',enabled:true},
  {id:'douYin',name:'抖音发布',monthTarget:8,weekTarget:2,unit:'条',enabled:true},
  {id:'yunXing',name:'运行改善',monthTarget:2,weekTarget:1,unit:'次',enabled:true}
];

let mode = 'week'; // week | month
let currentPage = 'dashboard';
let editingId = null;

const DEFAULT_WEIGHTS = {weekProcess:80,weekResult:20,monthProcess:20,monthResult:80};

function loadData() {
  return {
    records: JSON.parse(localStorage.getItem('sm_records')||'[]'),
    people: JSON.parse(localStorage.getItem('sm_people')||JSON.stringify(DEFAULT_PEOPLE)),
    indicators: JSON.parse(localStorage.getItem('sm_indicators')||JSON.stringify(DEFAULT_INDICATORS)),
    config: JSON.parse(localStorage.getItem('sm_config')||'{"showResult":true,"showProcess":true,"showScore":true,"showGrade":true}'),
    weights: JSON.parse(localStorage.getItem('sm_weights')||JSON.stringify(DEFAULT_WEIGHTS))
  };
}
function saveData(d) {
  localStorage.setItem('sm_records', JSON.stringify(d.records));
  localStorage.setItem('sm_people', JSON.stringify(d.people));
  localStorage.setItem('sm_indicators', JSON.stringify(d.indicators));
  localStorage.setItem('sm_config', JSON.stringify(d.config));
}

// ─── SCORING ───
function calcScore(rec, indicators, m) {
  // result score: salesAct/salesTarget * 100, capped 120
  const sa = m==='week' ? (rec.wSalesAct||0) : (rec.salesAct||0);
  const st = m==='week' ? (rec.wSalesTarget||rec.salesTarget||1) : (rec.salesTarget||1);
  const resultScore = Math.min(120, st>0 ? (sa/st)*100 : 0);

  // process score: avg of (act/target)*100 for each enabled indicator
  const activeInds = indicators.filter(i=>i.enabled);
  let procTotal = 0, procCount = 0;
  activeInds.forEach(ind => {
    const target = m==='week' ? ind.weekTarget : ind.monthTarget;
    const actKey = m==='week' ? ('w_'+ind.id) : ('m_'+ind.id);
    const act = rec[actKey] || 0;
    if (target > 0) {
      procTotal += Math.min(120, (act/target)*100);
      procCount++;
    }
  });
  const processScore = procCount > 0 ? procTotal/procCount : 0;

  const wts = JSON.parse(localStorage.getItem('sm_weights')||JSON.stringify(DEFAULT_WEIGHTS));
  const pw = m==='week' ? (wts.weekProcess||80)/100 : (wts.monthProcess||20)/100;
  const rw = m==='week' ? (wts.weekResult||20)/100 : (wts.monthResult||80)/100;
  const composite = processScore*pw + resultScore*rw;

  let grade = '预警', gradeClass = 'cb-red';
  if (composite >= 90) { grade='优秀'; gradeClass='cb-green'; }
  else if (composite >= 70) { grade='良好'; gradeClass='cb-blue'; }
  else if (composite >= 50) { grade='达标'; gradeClass='cb-yellow'; }

  return {resultScore, processScore, composite, grade, gradeClass};
}

// ─── PAGE ROUTING ───
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-'+page)?.classList.add('active');
  const titles = {dashboard:'数据看板',ranking:'销售排名',config:'系统配置'};
  document.getElementById('pageTitle').textContent = titles[page]||page;
  const modeToggle = document.getElementById('modeToggle');
  modeToggle.style.display = page==='config' ? 'none' : 'flex';
  render();
}

function setMode(m) {
  mode = m;
  document.getElementById('modeWeek').classList.toggle('active', m==='week');
  document.getElementById('modeMonth').classList.toggle('active', m==='month');
  render();
}

function render() {
  const c = document.getElementById('mainContent');
  if (currentPage==='dashboard') renderDashboard(c);
  else if (currentPage==='ranking') renderRanking(c);
  else if (currentPage==='config') renderConfig(c);
}

// ─── DASHBOARD ───
function renderDashboard(c) {
  const d = loadData();
  const now = new Date();
  const curMonth = now.toISOString().slice(0,7);
  const isWeek = mode==='week';

  // Get latest record per person
  const latestRecs = {};
  d.records.forEach(r => {
    const key = r.name+'_'+r.region;
    if (!latestRecs[key] || r.month >= latestRecs[key].month) latestRecs[key] = r;
  });

  const people = d.people;
  const indicators = d.indicators.filter(i=>i.enabled);
  const regions = [...new Set(people.map(p=>p.region))];

  // Stats
  const allScores = people.map(p => {
    const key = p.name+'_'+p.region;
    const rec = latestRecs[key] || {};
    return calcScore(rec, d.indicators, mode).composite;
  });
  const avgScore = allScores.length ? (allScores.reduce((a,b)=>a+b,0)/allScores.length).toFixed(1) : 0;
  const excellent = allScores.filter(s=>s>=90).length;
  const warning = allScores.filter(s=>s<50).length;

  let html = `<div class="stat-row">
    <div class="stat-card"><div class="label">总人数</div><div class="value" style="color:var(--accent)">${people.length}</div><div class="sub">六省区</div></div>
    <div class="stat-card"><div class="label">平均综合分</div><div class="value" style="color:var(--green)">${avgScore}</div><div class="sub">${isWeek?'周会':'月会'}模式</div></div>
    <div class="stat-card"><div class="label">优秀人数</div><div class="value" style="color:var(--green)">${excellent}</div><div class="sub">≥90分</div></div>
    <div class="stat-card"><div class="label">预警人数</div><div class="value" style="color:var(--red)">${warning}</div><div class="sub">&lt;50分</div></div>
  </div>`;

  // Table per region
  regions.forEach(region => {
    const rPeople = people.filter(p=>p.region===region);
    html += `<div style="margin-bottom:24px"><div class="section-title">📍 ${region}省区</div>
    <div class="table-wrap"><table><thead><tr>
      <th>姓名</th><th>身份</th>
      ${isWeek ? '<th class="num">周发车实际</th><th class="num">周发车目标</th>' : '<th class="num">月发车实际</th><th class="num">月发车目标</th>'}
      <th class="num">完成率</th>`;
    indicators.forEach(ind => {
      html += `<th class="num">${ind.name}<br><small style="color:var(--muted)">${isWeek?'周目标'+ind.weekTarget:'月目标'+ind.monthTarget}</small></th>`;
    });
    html += `<th class="num">过程分</th><th class="num">结果分</th><th class="num">综合分</th><th>等级</th><th></th></tr></thead><tbody>`;

    rPeople.forEach(p => {
      const key = p.name+'_'+p.region;
      const rec = latestRecs[key] || {};
      const {resultScore, processScore, composite, grade, gradeClass} = calcScore(rec, d.indicators, mode);
      const sa = isWeek ? (rec.wSalesAct||0) : (rec.salesAct||0);
      const st = isWeek ? (rec.wSalesTarget||rec.salesTarget||0) : (rec.salesTarget||0);
      const rate = st>0 ? Math.min(120,(sa/st*100)).toFixed(0) : 0;
      const rateColor = rate>=100?'var(--green)':rate>=70?'var(--yellow)':'var(--red)';
      let trClass = composite>=90?'good':composite<50?'warn':'';
      html += `<tr class="${trClass}"><td><strong>${p.name}</strong></td>
        <td>${p.isHQ?'<span class="cell-badge cb-blue">总部</span>':''}</td>
        <td class="num">${sa}</td><td class="num">${st}</td>
        <td class="num"><span style="color:${rateColor};font-weight:700">${rate}%</span></td>`;
      indicators.forEach(ind => {
        const actKey = isWeek ? ('w_'+ind.id) : ('m_'+ind.id);
        const tgt = isWeek ? ind.weekTarget : ind.monthTarget;
        const act = rec[actKey]||0;
        const pct = tgt>0 ? Math.min(100,act/tgt*100) : 0;
        const fillColor = pct>=100?'var(--green)':pct>=70?'var(--yellow)':'var(--red)';
        html += `<td class="num"><div class="prog-wrap"><div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${fillColor}"></div></div><span class="prog-val">${act}</span></div></td>`;
      });
      html += `<td class="num cell-score" style="color:var(--purple)">${processScore.toFixed(0)}</td>
        <td class="num cell-score" style="color:var(--orange)">${resultScore.toFixed(0)}</td>
        <td class="num cell-score" style="color:${composite>=90?'var(--green)':composite<50?'var(--red)':'var(--accent)'}">${composite.toFixed(0)}</td>
        <td><span class="cell-badge ${gradeClass}">${grade}</span></td>
        <td><button class="btn btn-sm" onclick="openEdit('${p.name}','${p.region}')">编辑</button> <button class="btn btn-sm" style="background:rgba(188,140,255,.15);color:var(--purple);border-color:rgba(188,140,255,.3)" onclick="openAnalysis('${p.name}','${p.region}')">分析</button></td></tr>`;
    });
    html += `</tbody></table></div></div>`;
  });

  c.innerHTML = html;
}

// ─── RANKING ───
function renderRanking(c) {
  const d = loadData();
  const isWeek = mode==='week';

  const latestRecs = {};
  d.records.forEach(r => {
    const key = r.name+'_'+r.region;
    if (!latestRecs[key] || r.month >= latestRecs[key].month) latestRecs[key] = r;
  });

  const ranked = d.people.map(p => {
    const key = p.name+'_'+p.region;
    const rec = latestRecs[key] || {};
    const scores = calcScore(rec, d.indicators, mode);
    return {...p, ...scores};
  }).sort((a,b)=>b.composite-a.composite);

  const wts = loadData().weights || DEFAULT_WEIGHTS;
  const modeDesc = isWeek
    ? `周会模式（过程${wts.weekProcess||80}%+结果${wts.weekResult||20}%）`
    : `月会模式（结果${wts.monthResult||80}%+过程${wts.monthProcess||20}%）`;

  let rankingView = 'all';

  function renderRankingContent(view) {
    let html2 = `<div class="section-title">🏆 销售综合排名 <span style="font-size:13px;color:var(--muted);font-weight:400">${modeDesc}</span></div>`;
    html2 += `<div style="display:flex;gap:8px;margin-bottom:20px">
      <button class="btn ${view==='all'?'btn-primary':''}" onclick="renderRankingView('all')">全员排名</button>
      <button class="btn ${view==='region'?'btn-primary':''}" onclick="renderRankingView('region')">省区排名</button>
    </div>`;

    if (view==='all') {
      ranked.forEach((p, i) => {
        const rank = i+1;
        const numClass = rank===1?'gold':rank===2?'silver':rank===3?'bronze':'other';
        const medal = rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
        html2 += `<div class="rank-card">
          <div class="rank-num ${numClass}">${medal||rank}</div>
          <div class="rank-info">
            <div class="rank-name">${p.name} ${p.isHQ?'<span class="cell-badge cb-blue" style="font-size:11px;padding:1px 8px">总部</span>':''}</div>
            <div class="rank-region">📍 ${p.region}</div>
          </div>
          <div class="rank-scores">
            <div class="rank-score-item"><div class="sv" style="color:var(--orange)">${p.resultScore.toFixed(0)}</div><div class="sl">结果分</div></div>
            <div class="rank-score-item"><div class="sv" style="color:var(--purple)">${p.processScore.toFixed(0)}</div><div class="sl">过程分</div></div>
            <div class="rank-score-item"><div class="sv" style="color:${p.composite>=90?'var(--green)':p.composite<50?'var(--red)':'var(--accent)'};font-size:22px">${p.composite.toFixed(0)}</div><div class="sl">综合分</div></div>
            <div class="rank-score-item"><span class="cell-badge ${p.gradeClass}">${p.grade}</span></div>
          </div>
        </div>`;
      });
    } else {
      const regions = [...new Set(ranked.map(p=>p.region))];
      regions.forEach(region => {
        const regionPeople = ranked.filter(p=>p.region===region).sort((a,b)=>b.composite-a.composite);
        const avg = regionPeople.length ? (regionPeople.reduce((s,p)=>s+p.composite,0)/regionPeople.length).toFixed(1) : '0.0';
        html2 += `<div style="margin-bottom:24px">
          <div class="section-title" style="font-size:15px">📍 ${region}省区 <span style="font-size:13px;color:var(--muted);font-weight:400">省区平均分 ${avg}</span></div>`;
        regionPeople.forEach((p, i) => {
          const rank = i+1;
          const numClass = rank===1?'gold':rank===2?'silver':rank===3?'bronze':'other';
          const medal = rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
          html2 += `<div class="rank-card">
            <div class="rank-num ${numClass}">${medal||rank}</div>
            <div class="rank-info">
              <div class="rank-name">${p.name} ${p.isHQ?'<span class="cell-badge cb-blue" style="font-size:11px;padding:1px 8px">总部</span>':''}</div>
              <div class="rank-region">📍 ${p.region}</div>
            </div>
            <div class="rank-scores">
              <div class="rank-score-item"><div class="sv" style="color:var(--orange)">${p.resultScore.toFixed(0)}</div><div class="sl">结果分</div></div>
              <div class="rank-score-item"><div class="sv" style="color:var(--purple)">${p.processScore.toFixed(0)}</div><div class="sl">过程分</div></div>
              <div class="rank-score-item"><div class="sv" style="color:${p.composite>=90?'var(--green)':p.composite<50?'var(--red)':'var(--accent)'};font-size:22px">${p.composite.toFixed(0)}</div><div class="sl">综合分</div></div>
              <div class="rank-score-item"><span class="cell-badge ${p.gradeClass}">${p.grade}</span></div>
            </div>
          </div>`;
        });
        html2 += `</div>`;
      });
    }
    return html2;
  }

  window.renderRankingView = function(view) {
    c.innerHTML = renderRankingContent(view);
  };

  let html = renderRankingContent('all');

  c.innerHTML = html;
}

function onWeightInput(mode, type) {
  const pEl = document.getElementById('cfg'+capitalize(mode)+'P');
  const rEl = document.getElementById('cfg'+capitalize(mode)+'R');
  const tipEl = document.getElementById(mode+'WeightTip');
  if (!pEl || !rEl || !tipEl) return;
  const p = +(pEl.value||0), r = +(rEl.value||0);
  const sum = p+r;
  tipEl.textContent = '过程+结果='+sum+'%';
  tipEl.style.color = sum===100 ? 'var(--green)' : 'var(--red)';
}

function capitalize(s) { return s.charAt(0).toUpperCase()+s.slice(1); }

function saveWeights() {
  const wP = +(document.getElementById('cfgWeekP').value||80);
  const wR = +(document.getElementById('cfgWeekR').value||20);
  const mP = +(document.getElementById('cfgMonthP').value||20);
  const mR = +(document.getElementById('cfgMonthR').value||80);
  if (wP+wR !== 100) return alert('周会模式：过程权重+结果权重必须等于100%');
  if (mP+mR !== 100) return alert('月会模式：过程权重+结果权重必须等于100%');
  localStorage.setItem('sm_weights', JSON.stringify({weekProcess:wP,weekResult:wR,monthProcess:mP,monthResult:mR}));
  alert('权重配置已保存！');
}

// ─── ANALYSIS MODAL ───
function openAnalysis(name, region) {
  const d = loadData();
  const latestRecs = {};
  d.records.forEach(r => {
    const k = r.name+'_'+r.region;
    if (!latestRecs[k] || r.month >= latestRecs[k].month) latestRecs[k] = r;
  });
  const rec = latestRecs[name+'_'+region] || {};
  const indicators = d.indicators.filter(i=>i.enabled);
  const person = d.people.find(p=>p.name===name&&p.region===region)||{name,region,isHQ:false};
  const isWeek = mode==='week';

  const {resultScore, processScore, composite, grade, gradeClass} = calcScore(rec, d.indicators, mode);

  // Compute average
  const allScores = d.people.map(p => {
    const k = p.name+'_'+p.region;
    return calcScore(latestRecs[k]||{}, d.indicators, mode).composite;
  });
  const avg = allScores.length ? allScores.reduce((a,b)=>a+b,0)/allScores.length : 0;
  const diff = composite - avg;
  const diffSign = diff >= 0 ? '+' : '';
  const diffColor = diff >= 0 ? 'var(--green)' : 'var(--red)';

  // Process indicators
  let indHtml = '';
  let weakestInd = null, weakestPct = Infinity;
  indicators.forEach(ind => {
    const tgt = isWeek ? ind.weekTarget : ind.monthTarget;
    const actKey = isWeek ? ('w_'+ind.id) : ('m_'+ind.id);
    const act = rec[actKey]||0;
    const pct = tgt > 0 ? Math.min(100, act/tgt*100) : 0;
    const fillColor = pct>=100?'var(--green)':pct>=70?'var(--yellow)':'var(--red)';
    if (pct < weakestPct) { weakestPct = pct; weakestInd = ind; }
    indHtml += `<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
        <span>${ind.name}</span><span style="color:${fillColor};font-weight:700">${pct.toFixed(0)}%</span>
      </div>
      <div class="prog-track" style="height:10px">
        <div class="prog-fill" style="width:${pct}%;background:${fillColor}"></div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">实际 ${act} / 目标 ${tgt} ${ind.unit||'次'}</div>
    </div>`;
  });

  // Result analysis
  const sa = isWeek ? (rec.wSalesAct||0) : (rec.salesAct||0);
  const st = isWeek ? (rec.wSalesTarget||rec.salesTarget||0) : (rec.salesTarget||0);
  const rateVal = st>0 ? (sa/st*100) : 0;
  const rateColor = rateVal>=100?'var(--green)':rateVal>=70?'var(--yellow)':'var(--red)';
  const rateTrend = rateVal>=100?'已完成目标，表现优异':rateVal>=80?'接近目标，继续努力':'尚有差距，需加强推进';

  // AI-style analysis
  const procLevel = processScore>=90?'优秀':processScore>=70?'良好':processScore>=50?'一般':'偏弱';
  const resLevel = resultScore>=90?'优秀':resultScore>=70?'良好':resultScore>=50?'一般':'偏弱';
  let aiText = '';
  if (processScore>=70 && resultScore>=70) {
    aiText = '过程指标与结果指标均表现良好，综合能力均衡，建议保持当前节奏并冲击更高目标。';
  } else if (processScore>=70 && resultScore<70) {
    aiText = '过程指标完成较好，日常推进积极；但结果指标（发车量）有待提升，建议关注转化效率，将过程投入转化为实际业绩。';
  } else if (processScore<70 && resultScore>=70) {
    aiText = '结果指标表现良好，发车业绩突出；但过程指标有所欠缺，建议加强日常打卡、沙龙等过程管理，为后续持续增长打好基础。';
  } else {
    aiText = '当前过程与结果指标均有提升空间，建议优先聚焦核心动作，加强标杆打造和客户拜访，同时确保发车目标的落地推进。';
  }

  // Suggestion based on weakest
  let suggestion = '整体表现良好，建议继续保持。';
  if (weakestInd && weakestPct < 80) {
    suggestion = `「${weakestInd.name}」是当前最薄弱环节（完成率${weakestPct.toFixed(0)}%），建议优先提升此项，制定具体行动计划，争取下周期达标。`;
  }

  const modalHtml = `
  <div class="modal-overlay show" id="analysisModal" onclick="if(event.target===this)closeModal('analysisModal')">
    <div class="modal" style="width:min(680px,95vw)">
      <div class="modal-header">
        <span>🔍 个人工作分析</span>
        <button class="close" onclick="closeModal('analysisModal')">✕</button>
      </div>
      <div class="modal-body">
        <div style="display:flex;gap:16px;align-items:center;padding:14px;background:var(--surface2);border-radius:10px;margin-bottom:20px">
          <div style="font-size:36px">👤</div>
          <div>
            <div style="font-size:18px;font-weight:800">${name} ${person.isHQ?'<span class="cell-badge cb-blue" style="font-size:11px">总部</span>':''}</div>
            <div style="font-size:14px;color:var(--muted);margin-top:4px">📍 ${region}省区 · ${isWeek?'周会':'月会'}模式分析</div>
          </div>
          <div style="margin-left:auto;text-align:center">
            <div style="font-size:36px;font-weight:900;color:${composite>=90?'var(--green)':composite<50?'var(--red)':'var(--accent)'}">${composite.toFixed(0)}</div>
            <span class="cell-badge ${gradeClass}">${grade}</span>
          </div>
        </div>

        <div style="margin-bottom:20px">
          <div class="section-title" style="font-size:14px">📋 过程指标完成情况</div>
          ${indHtml}
        </div>

        <div style="margin-bottom:20px;padding:14px;background:var(--surface2);border-radius:10px">
          <div style="font-size:14px;font-weight:700;margin-bottom:10px">🚚 发车完成率分析</div>
          <div style="display:flex;gap:24px;align-items:center;margin-bottom:8px">
            <div><span style="font-size:24px;font-weight:900;color:${rateColor}">${rateVal.toFixed(0)}%</span><div style="font-size:12px;color:var(--muted)">完成率</div></div>
            <div><span style="font-size:18px;font-weight:700">${sa}</span><div style="font-size:12px;color:var(--muted)">实际发车</div></div>
            <div><span style="font-size:18px;font-weight:700">${st}</span><div style="font-size:12px;color:var(--muted)">目标发车</div></div>
          </div>
          <div style="font-size:13px;color:var(--muted)">${rateTrend}</div>

          <div style="display:flex;gap:24px">
            <div><span style="font-size:18px;font-weight:700;color:var(--purple)">${processScore.toFixed(0)}</span><div style="font-size:12px;color:var(--muted)">过程分（${procLevel}）</div></div>
            <div><span style="font-size:18px;font-weight:700;color:var(--orange)">${resultScore.toFixed(0)}</span><div style="font-size:12px;color:var(--muted)">结果分（${resLevel}）</div></div>
            <div><span style="font-size:18px;font-weight:700;color:var(--muted)">${avg.toFixed(1)}</span><div style="font-size:12px;color:var(--muted)">团队平均</div></div>
            <div><span style="font-size:18px;font-weight:700;color:${diffColor}">${diffSign}${diff.toFixed(1)}</span><div style="font-size:12px;color:var(--muted)">${diff>=0?'高于':'低于'}平均</div></div>
          </div>
        </div>

        <div style="margin-bottom:16px;padding:14px;background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.2);border-radius:10px">
          <div style="font-size:14px;font-weight:700;margin-bottom:6px">🤖 AI 分析</div>
          <div style="font-size:14px;line-height:1.7;color:var(--text)">${aiText}</div>
        </div>

        <div style="padding:14px;background:rgba(63,185,80,.06);border:1px solid rgba(63,185,80,.2);border-radius:10px">
          <div style="font-size:14px;font-weight:700;margin-bottom:6px">💡 改进建议</div>
          <div style="font-size:14px;line-height:1.7;color:var(--text)">${suggestion}</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="closeModal('analysisModal')">关闭</button>
      </div>
    </div>
  </div>`;

  // Remove existing analysis modal if any
  const existing = document.getElementById('analysisModal');
  if (existing) existing.remove();
  document.body.insertAdjacentHTML('beforeend', modalHtml);
}

function updateConfig(key, val) {
  const d = loadData();

  saveData(d);
}

function updateIndicator(idx, key, val) {

  saveData(d);
}

function toggleIndicator(idx, val) {

// ─── MODAL ───
let _editName = null, _editRegion = null;

function buildIndicatorInputs() {
  const d = loadData();
  const inds = d.indicators.filter(i=>i.enabled);

  let mHtml = '', wHtml = '';
  inds.forEach(ind => {
    const mVal = (_editName && _editRegion) ? getRecordVal(_editName, _editRegion, 'm_'+ind.id) : '';
    const wVal = (_editName && _editRegion) ? getRecordVal(_editName, _editRegion, 'w_'+ind.id) : '';
    mHtml += `<div class="form-item"><label>${ind.name}（月目标${ind.monthTarget}${ind.unit}）</label>
      <input id="fi_m_${ind.id}" type="number" min="0" value="${mVal}" placeholder="0" oninput="previewEval()"></div>`;
    wHtml += `<div class="form-item"><label>${ind.name}（周目标${ind.weekTarget}${ind.unit}）</label>
      <input id="fi_w_${ind.id}" type="number" min="0" value="${wVal}" placeholder="0"></div>`;
  });
  document.getElementById('monthIndicators').innerHTML = mHtml;
  document.getElementById('weekIndicators').innerHTML = wHtml;
}

function getRecordVal(name, region, key) {
  const d = loadData();
  const latestRecs = {};
  d.records.forEach(r => {
    const k = r.name+'_'+r.region;
    if (!latestRecs[k] || r.month >= latestRecs[k].month) latestRecs[k] = r;
  });
  const rec = latestRecs[name+'_'+region] || {};
  return rec[key] !== undefined ? rec[key] : '';
}

function openAdd() {
  _editName = null; _editRegion = null; editingId = null;
  document.getElementById('modalTitle').textContent = '录入数据';
  const now = new Date();
  document.getElementById('fName').value = '';
  document.getElementById('fMonth').value = now.toISOString().slice(0,7);
  document.getElementById('fSalesAct').value = '';
  document.getElementById('fSalesTarget').value = '';
  document.getElementById('fIsHQ').value = '0';
  document.getElementById('wSalesAct').value = '';
  document.getElementById('wSalesTarget').value = '';
  buildIndicatorInputs();
  switchTab('tabMonth');
  document.getElementById('evalPreview').innerHTML = '';
  document.getElementById('editModal').classList.add('show');
}

function openEdit(name, region) {
  _editName = name; _editRegion = region;
  const d = loadData();
  const latestRecs = {};
  d.records.forEach(r => {
    const k = r.name+'_'+r.region;
    if (!latestRecs[k] || r.month >= latestRecs[k].month) latestRecs[k] = r;
  });
  const rec = latestRecs[name+'_'+region] || {};
  editingId = rec.id || null;

  document.getElementById('modalTitle').textContent = `编辑：${name}（${region}）`;
  document.getElementById('fName').value = name;
  document.getElementById('fRegion').value = region;
  document.getElementById('fMonth').value = rec.month || new Date().toISOString().slice(0,7);
  document.getElementById('fIsHQ').value = rec.isHQ ? '1' : '0';
  document.getElementById('fSalesAct').value = rec.salesAct || '';
  document.getElementById('fSalesTarget').value = rec.salesTarget || '';
  document.getElementById('wSalesAct').value = rec.wSalesAct || '';
  document.getElementById('wSalesTarget').value = rec.wSalesTarget || '';
  buildIndicatorInputs();
  previewEval();
  switchTab('tabMonth');
  document.getElementById('editModal').classList.add('show');
}

function switchTab(tabId) {
  ['tabMonth','tabWeek'].forEach(t => {
    document.getElementById(t).classList.toggle('active', t===tabId);
    document.getElementById(t+'Btn').classList.toggle('active', t===tabId);
  });
}

function previewEval() {
  const d = loadData();
  const sa = +(document.getElementById('fSalesAct').value||0);
  const st = +(document.getElementById('fSalesTarget').value||1);
  const tmpRec = {salesAct:sa, salesTarget:st};
  d.indicators.filter(i=>i.enabled).forEach(ind => {
    const el = document.getElementById('fi_m_'+ind.id);
    if (el) tmpRec['m_'+ind.id] = +(el.value||0);
  });
  const {resultScore, processScore, composite, grade, gradeClass} = calcScore(tmpRec, d.indicators, 'month');
  document.getElementById('evalPreview').innerHTML = `
    <div style="font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px">评分预览（月维度）</div>
    <div style="display:flex;gap:20px;align-items:center">
      <div><span style="color:var(--orange);font-size:22px;font-weight:900">${resultScore.toFixed(0)}</span><div style="font-size:12px;color:var(--muted)">结果分</div></div>
      <div><span style="color:var(--purple);font-size:22px;font-weight:900">${processScore.toFixed(0)}</span><div style="font-size:12px;color:var(--muted)">过程分</div></div>
      <div><span style="color:var(--accent);font-size:26px;font-weight:900">${composite.toFixed(0)}</span><div style="font-size:12px;color:var(--muted)">综合分</div></div>
      <span class="cell-badge ${gradeClass}" style="font-size:15px">${grade}</span>
    </div>`;
}

function saveRecord() {
  const d = loadData();
  const name = document.getElementById('fName').value.trim();
  const region = document.getElementById('fRegion').value;
  const month = document.getElementById('fMonth').value;
  if (!name) return alert('请输入姓名');

  const rec = {
    id: editingId || Date.now()+'',
    name, region, month,
    isHQ: document.getElementById('fIsHQ').value==='1',
    salesAct: +(document.getElementById('fSalesAct').value||0),
    salesTarget: +(document.getElementById('fSalesTarget').value||0),
    wSalesAct: +(document.getElementById('wSalesAct').value||0),
    wSalesTarget: +(document.getElementById('wSalesTarget').value||0),
  };

  d.indicators.filter(i=>i.enabled).forEach(ind => {
    const mEl = document.getElementById('fi_m_'+ind.id);
    const wEl = document.getElementById('fi_w_'+ind.id);
    if (mEl) rec['m_'+ind.id] = +(mEl.value||0);
    if (wEl) rec['w_'+ind.id] = +(wEl.value||0);
  });

  // upsert by name+region+month
  const existing = d.records.findIndex(r => r.name===name && r.region===region && r.month===month);
  if (existing>=0) d.records[existing] = rec;
  else d.records.push(rec);

  // ensure person exists
  if (!d.people.find(p=>p.name===name&&p.region===region)) {
    d.people.push({name, region, isHQ: rec.isHQ});
  }

  saveData(d);
  closeModal('editModal');
  render();
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

// ─── CSV ───
function exportCSV() {
  const d = loadData();
  const inds = d.indicators;
  const headers = ['姓名','省区','月份','是否总部','发车实际(月)','发车目标(月)','发车实际(周)','发车目标(周)'];
  inds.forEach(ind => {
    headers.push(ind.name+'_月实际', ind.name+'_月目标', ind.name+'_周实际', ind.name+'_周目标');
  });
  headers.push('月结果分','月过程分','月综合分','月等级','周结果分','周过程分','周综合分','周等级');

  const rows = [headers];
  const latestRecs = {};
  d.records.forEach(r => {
    const k = r.name+'_'+r.region;
    if (!latestRecs[k] || r.month >= latestRecs[k].month) latestRecs[k] = r;
  });

  d.people.forEach(p => {
    const rec = latestRecs[p.name+'_'+p.region] || {};
    const ms = calcScore(rec, d.indicators, 'month');
    const ws = calcScore(rec, d.indicators, 'week');
    const row = [p.name, p.region, rec.month||'', p.isHQ?'是':'否',
      rec.salesAct||0, rec.salesTarget||0, rec.wSalesAct||0, rec.wSalesTarget||0];
    inds.forEach(ind => {
      row.push(rec['m_'+ind.id]||0, ind.monthTarget, rec['w_'+ind.id]||0, ind.weekTarget);
    });
    row.push(ms.resultScore.toFixed(0), ms.processScore.toFixed(0), ms.composite.toFixed(0), ms.grade,
             ws.resultScore.toFixed(0), ws.processScore.toFixed(0), ws.composite.toFixed(0), ws.grade);
    rows.push(row);
  });

  const csv = '\ufeff' + rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='销售数据.csv'; a.click();
  URL.revokeObjectURL(url);
}

function importCSV(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      let text = ev.target.result;
      if (text.charCodeAt(0)===0xFEFF) text = text.slice(1);
      const lines = text.split('\n').filter(l=>l.trim());
      const headers = parseCSVLine(lines[0]);
      const d = loadData();
      let count = 0;
      for (let i=1;i<lines.length;i++) {
        const vals = parseCSVLine(lines[i]);
        if (vals.length<4) continue;
        const name=vals[0], region=vals[1], month=vals[2];
        if (!name||!region) continue;
        const rec = {id:Date.now()+'_'+i, name, region, month, isHQ:vals[3]==='是',
          salesAct:+vals[4]||0, salesTarget:+vals[5]||0, wSalesAct:+vals[6]||0, wSalesTarget:+vals[7]||0};
        const existing = d.records.findIndex(r=>r.name===name&&r.region===region&&r.month===month);
        if (existing>=0) d.records[existing]=rec; else d.records.push(rec);
        if (!d.people.find(p=>p.name===name&&p.region===region)) d.people.push({name,region,isHQ:rec.isHQ});
        count++;
      }
      saveData(d); render();
      alert('成功导入 '+count+' 条数据！');
    } catch(err) { alert('导入失败：'+err.message); }
  };
  reader.readAsText(file,'utf-8');
  e.target.value='';
}

function parseCSVLine(line) {
  const result=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){inQ=!inQ;}
    else if(ch===','&&!inQ){result.push(cur);cur='';}
    else cur+=ch;
  }
  result.push(cur);
  return result.map(s=>s.trim());
}

// ─── INIT ───
function init() {
  // seed default people if no records but people exist
  const d = loadData();
  if (!d.people || d.people.length===0) {
    d.people = DEFAULT_PEOPLE;
    saveData(d);
  }
  render();
}

init();

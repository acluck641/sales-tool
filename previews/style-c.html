<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style C — Broadside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,700;0,900;1,900&family=IBM+Plex+Mono:wght@400;700&family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #111111;
  --ink-alt: #1A1A18;
  --orange: #E85D26;
  --cream: #F0ECE5;
  --cream-muted: #888880;
  --border: #282826;
  --stage-bg: #0a0a08;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--stage-bg); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg); }
.deck-stage {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px;
  overflow: hidden; transform-origin: 0 0;
  background: var(--ink);
}

.slide {
  position: absolute; inset: 0;
  width: 1920px; height: 1080px;
  background: var(--ink);
  display: flex;
  visibility: visible; opacity: 1;
}

/* Left column */
.left-col {
  width: 72px;
  background: var(--ink-alt);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-between;
  padding: 48px 0;
}
.col-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--cream-muted);
  writing-mode: vertical-rl;
  text-orientation: mixed;
  transform: rotate(180deg);
}
.col-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--orange);
}

/* Main area */
.main-area {
  flex: 1;
  display: flex; flex-direction: column;
}

/* Top bar */
.top-bar {
  height: 72px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 72px;
  justify-content: space-between;
}
.top-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--cream-muted);
}
.top-date {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px; color: var(--orange);
  letter-spacing: 0.05em;
}

/* Hero */
.hero {
  flex: 1;
  display: flex; align-items: flex-end;
  padding: 0 72px 0 72px;
  position: relative;
  overflow: hidden;
}

.hero-bg-num {
  position: absolute;
  right: -20px; bottom: -60px;
  font-family: 'Barlow', sans-serif;
  font-size: 600px; font-weight: 900;
  font-style: italic;
  color: rgba(232,93,38,0.06);
  line-height: 1;
  user-select: none; pointer-events: none;
}

.hero-content {
  position: relative; z-index: 1;
  padding-bottom: 72px;
}
.hero-kicker {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--orange);
  margin-bottom: 28px;
  display: flex; align-items: center; gap: 16px;
}
.hero-kicker::before {
  content: '';
  display: inline-block;
  width: 32px; height: 2px;
  background: var(--orange);
}
.hero-main {
  font-family: 'Barlow', 'Noto Sans SC', sans-serif;
  font-size: 160px; font-weight: 900;
  font-style: italic;
  line-height: 0.88;
  color: var(--cream);
  letter-spacing: -4px;
}
.hero-main .accent { color: var(--orange); }

/* Bottom panel */
.bottom-panel {
  height: 160px;
  border-top: 1px solid var(--border);
  display: flex;
}
.bp-stat {
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 0 56px;
  gap: 6px;
}
.bp-num {
  font-family: 'Barlow', monospace;
  font-size: 52px; font-weight: 900;
  color: var(--orange); line-height: 1;
}
.bp-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--cream-muted);
}
.bp-chapters {
  flex: 1;
  display: flex; align-items: center;
  padding: 0 56px;
  gap: 0;
}
.bp-ch {
  flex: 1;
  display: flex; flex-direction: column; gap: 6px;
  padding-right: 32px;
  border-right: 1px solid var(--border);
  margin-right: 32px;
}
.bp-ch:last-child { border-right: none; }
.bp-ch-num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; color: var(--orange); letter-spacing: 0.08em;
}
.bp-ch-title {
  font-family: 'Barlow', 'Noto Sans SC', sans-serif;
  font-size: 18px; font-weight: 700;
  color: var(--cream); letter-spacing: -0.3px;
}
.bp-meta {
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 0 48px;
  gap: 6px; text-align: right;
  border-left: 1px solid var(--border);
}
.bp-meta-name {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px; color: var(--cream);
}
.bp-meta-sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; color: var(--cream-muted);
  letter-spacing: 0.08em;
}

/* Animation */
.main-area { opacity: 0; transform: translateX(20px); transition: all 0.6s cubic-bezier(0.16,1,0.3,1) 0.1s; }
.left-col { opacity: 0; transition: opacity 0.4s 0.05s; }
.loaded .main-area { opacity: 1; transform: translateX(0); }
.loaded .left-col { opacity: 1; }
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="stage">
    <section class="slide">
      <div class="left-col">
        <span class="col-label">快递生态大客户管理中心</span>
        <div class="col-dot"></div>
        <span class="col-label">2026 · 六省区</span>
      </div>
      <div class="main-area">
        <div class="top-bar">
          <span class="top-title">快递无人车攻坚 · 作战周报</span>
          <span class="top-date">2026.06.09 — W01</span>
        </div>
        <div class="hero">
          <div class="hero-bg-num">W1</div>
          <div class="hero-content">
            <div class="hero-kicker">六省区综合进度汇报</div>
            <div class="hero-main">6月<br><span class="accent">第一周</span><br>作战周报</div>
          </div>
        </div>
        <div class="bottom-panel">
          <div class="bp-stat">
            <div class="bp-num">34</div>
            <div class="bp-label">已发车 / 650目标</div>
          </div>
          <div class="bp-stat">
            <div class="bp-num">4</div>
            <div class="bp-label">线下沙龙场次</div>
          </div>
          <div class="bp-chapters">
            <div class="bp-ch"><span class="bp-ch-num">01</span><span class="bp-ch-title">发车看板</span></div>
            <div class="bp-ch"><span class="bp-ch-num">02</span><span class="bp-ch-title">关键事件</span></div>
            <div class="bp-ch"><span class="bp-ch-num">03</span><span class="bp-ch-title">三大网对接</span></div>
            <div class="bp-ch"><span class="bp-ch-num">04</span><span class="bp-ch-title">风险与行动</span></div>
          </div>
          <div class="bp-meta">
            <span class="bp-meta-name">陈子航</span>
            <span class="bp-meta-sub">快递生态大客户管理中心</span>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<script>
const s = document.getElementById('stage');
const scale = () => {
  const f = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  const x = (window.innerWidth-1920*f)/2, y = (window.innerHeight-1080*f)/2;
  s.style.transform = `translate(${x}px,${y}px) scale(${f})`;
};
scale(); window.addEventListener('resize', scale);
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('loaded')));
</script>
</body>
</html>
